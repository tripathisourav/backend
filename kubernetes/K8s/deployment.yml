apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment #deployment ka naam
spec:
  replicas: 3
  selector:
    matchLabels:
      app: main-server
  template:
    metadata:
      labels:
        app: main-server # label given to every pod
    spec:
      containers: # a pod can run multiple containers
      - name: main-server # name of container
        image: express_cohort_2:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000 # container mein traffic konse port se jayega 
        resources:
          limits:
            memory: "128Mi" # RAM 128 megabytes
            cpu: "500m" # CPU 500 millicores (0.5 CPU core)
            # 1 core = 1000m (1000 millicores)
          requests: 
            memory: "64Mi"
            cpu: "250m"


# development simple
