apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-ingress
  labels:
    app.kubernetes.io/name: express-ingress
spec:
  ingressClassName: nginx
  rules:
    - http: 
        paths:
        - pathType: Prefix
          path: "/"  #jo bhi traffic aayega agr woh / se start ho rha hai toh use express-service pe bhej doge
          backend:
            service:
              name: express-service
              port: 
                number: 80
    - http: 
        paths:
        - pathType: Prefix
          path: "/api/product"  #jo bhi traffic aayega agr woh / se start ho rha hai toh use express-service pe bhej doge
          backend:
            service:
              name: product-service
              port: 
                number: 80

# rules file 
# setup ingresscontroller before this

