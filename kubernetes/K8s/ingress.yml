apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-app
  labels:
    app.kubernetes.io/name: express-app
spec:
  ingressClassName: nginx
  rules:
    - http: 
        paths:
        - pathType: Prefix
          path: "/"  #jo bhi traffic aayega agr woh / se start ho rha hai toh use main-server-service pe bhej doge
          backend:
            service:
              name: main-server-service
              port: 
                number: 80
    - http: 
        paths:
        - pathType: Prefix
          path: "/api/product"  
          backend:
            service:
              name: product-service
              port: 
                number: 80

# rules file 
# download ingresscontroller before this
# command -> kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/cloud/deploy.yaml
