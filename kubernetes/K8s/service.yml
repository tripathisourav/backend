kind: Service
apiVersion: v1
metadata:
  name:  express-service
spec:
  selector:
    app:  express #labels of deployment file should be similar to the ones here aisa isliye kyuki isse hi service ko pta chalega kin pods ke pass traffic le jaana hai 
  type:  ClusterIP
  ports:
  - name:  http
    port:  80
    targetPort:  3000 #container ka pod target port 
